<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SignBridge icon: an open hand emitting sound waves — sign to speech. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cf0"/>
      <stop offset="1" stop-color="#153a8f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- palm + fingers, simplified geometric hand -->
  <g fill="#ffffff">
    <!-- fingers -->
    <rect x="150" y="128" width="34" height="150" rx="17"/>
    <rect x="196" y="96"  width="34" height="182" rx="17"/>
    <rect x="242" y="112" width="34" height="166" rx="17"/>
    <rect x="288" y="140" width="34" height="138" rx="17"/>
    <!-- thumb -->
    <rect x="118" y="238" width="34" height="118" rx="17" transform="rotate(42 135 297)"/>
    <!-- palm -->
    <path d="M150 250 h172 a0 0 0 0 1 0 0 v66 a86 86 0 0 1 -86 86 a86 86 0 0 1 -86 -86 z"/>
  </g>

  <!-- sound waves from the hand -->
  <g fill="none" stroke="#7fd0ff" stroke-width="26" stroke-linecap="round">
    <path d="M366 236 a70 70 0 0 1 0 96"/>
    <path d="M404 200 a122 122 0 0 1 0 168"/>
  </g>
</svg>
