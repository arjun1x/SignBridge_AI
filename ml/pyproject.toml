[project]
name = "signbridge-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "kaggle>=1.6",
    "mediapipe>=0.10.35",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["signbridge_ml"]
